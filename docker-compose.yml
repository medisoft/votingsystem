      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  admin:
    image: node:24.15.0-bookworm
    working_dir: /workspace
    command: npm run dev -w @voting/registration-admin
    environment:
      API_PROXY_TARGET: http://api:3001
    ports: ['5173:5173']
    volumes: ['.:/workspace']
    depends_on:
      api:
        condition: service_healthy
  voting-client:
    image: node:24.15.0-bookworm
    working_dir: /workspace
    command: npm run dev -w @voting/voting-client
    environment:
      API_PROXY_TARGET: http://api:3001
    ports: ['5174:5174']
    volumes: ['.:/workspace']
    depends_on:
      api:
        condition: service_healthy
volumes:
  registration-postgres:
